{% extends 'base.html' %}
{% block content %}
<h2>Delete Ledger</h2>
<p>Are you sure you want to delete "{{ examledger }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'examledger.detail' examledger.id %}">Cancel</a>
</form>
{% endblock %}
