{% extends 'base.html' %}
{% block content %}
<h2>Delete Subject</h2>
<p>Are you sure you want to delete "{{ examsubject }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'examsubject.detail' examsubject.id %}">Cancel</a>
</form>
{% endblock %}
